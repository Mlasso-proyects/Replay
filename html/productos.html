<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REPLAY — Productos</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">
        <span class="brand-mark">♦</span>
        <span class="brand-name">REPLAY</span>
      </a>
      <nav class="main-nav" id="main-nav">
        <a href="index.html">Inicio</a>
        <a href="productos.html" class="active">Productos</a>
        <a href="buscar.html">Buscar</a>
        <a href="carrito.html">Compras</a>
        <a href="nosotros.html">Nosotros</a>
      </nav>
      <div class="header-actions">
        <a href="carrito.html" class="icon-link" aria-label="Carrito">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1" />
            <circle cx="19" cy="21" r="1" />
            <path d="M2 3h2l2.6 12.4a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.6L21 7H6" />
          </svg>
          <span class="badge">3</span>
        </a>
        <a href="perfil.html" class="icon-link avatar-link" aria-label="Perfil">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 20c1.8-4 5-6 8-6s6.2 2 8 6" />
          </svg>
        </a>
        <button class="menu-toggle" id="menuToggle" aria-label="Menú" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
    <div class="spool-stripe"><span></span><span></span><span></span><span></span></div>
  </header>

  <main class="page">

    <section class="page-hero">
      <div class="container row">
        <div>
          <h1>PRODUCTOS</h1>
          <p class="lede">Todo el catálogo de vinilos y cassettes, en un solo lugar.</p>
        </div>
      </div>
    </section>

    <section class="section container">
      <p class="section-tab">Vinilos</p>
      <div class="products-row-wrapper">
        <button class="scroll-arrow left" id="flecha-izq-vinilos" aria-label="Ver vinilos anteriores">‹</button>
        <div class="products-grid" id="grid-vinilos"></div>
        <button class="scroll-arrow right" id="flecha-der-vinilos" aria-label="Ver más vinilos">›</button>
      </div>
      <p class="quote">"Suma Música y revive emociones"</p>
      <p class="section-tab">Cassettes</p>
      <div class="products-row-wrapper">
        <button class="scroll-arrow left" id="flecha-izq-cassettes" aria-label="Ver cassettes anteriores">‹</button>
        <div class="products-grid" id="grid-cassettes"></div>
        <button class="scroll-arrow right" id="flecha-der-cassettes" aria-label="Ver más cassettes">›</button>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <p class="brand-name" style="font-size:18px;">REPLAY</p>
        <p class="tagline">♦ Vinilos y cassettes ♦</p>
      </div>
      <nav class="footer-links">
        <a href="nosotros.html">Nosotros</a>
        <a href="configuracion.html">Configuración</a>
        <a href="metodos-pago.html">Métodos de pago</a>
      </nav>
      <p class="copyright">© 2026 REPLAY — Hecho para melómanos.</p>
    </div>
  </footer>
  <script src="../javaScript/carrito.js"></script>
  <script src="../javaScript/productos.js"></script>
</body>

</html>
